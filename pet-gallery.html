<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Gallery | Tess Devillier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0a0a; color: #f5f5f5; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        .page-wrap { max-width: 960px; margin: 0 auto; padding: 48px 20px 80px; }
        .back-link { color: #ffd700; text-decoration: none; font-size: .9em; letter-spacing: 1px; display: inline-block; margin-bottom: 32px; }
        h1 { font-family: 'Cinzel', serif; color: #ffd700; font-size: 2.4rem; letter-spacing: 4px; text-align: center; margin-bottom: 8px; }
        .tagline { text-align: center; color: #888; margin-bottom: 16px; font-size: .95em; letter-spacing: 1px; }
        .hire-cta { text-align: center; margin-bottom: 48px; }
        .hire-cta a { display: inline-block; background: #ffd700; color: #111; font-weight: 700; padding: 10px 24px; border-radius: 10px; text-decoration: none; transition: background .2s; }
        .hire-cta a:hover { background: #ffe566; }
        .album { margin-bottom: 56px; }
        .album-header { margin-bottom: 18px; border-left: 3px solid #ffd700; padding-left: 16px; }
        .album-header h2 { font-family: 'Cinzel', serif; color: #ffd700; font-size: 1.4rem; margin: 0 0 4px 0; }
        .album-header p { color: #888; font-size: .9em; margin: 0; }
        .album-header .location { color: #ffd70099; font-size: .82em; margin-top: 4px; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .photo-cell { background: #1a1a1a; border-radius: 10px; aspect-ratio: 1; overflow: hidden; }
        .photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
        .photo-cell img:hover { transform: scale(1.05); }
        .photo-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #333; font-size: 2rem; }
        .testimonial { background: #111; border: 1px solid #ffd70022; border-radius: 12px; padding: 16px 20px; margin-top: 16px; color: #888; font-style: italic; font-size: .9em; line-height: 1.7; }
        .add-yours { background: #0d0d0d; border: 2px dashed #333; border-radius: 16px; padding: 32px; text-align: center; color: #555; }
        .add-yours p { margin: 0 0 8px; }
        .loading { text-align: center; color: #555; padding: 60px 0; }
        @media (max-width: 600px) { h1 { font-size: 1.7rem; } .photo-grid { grid-template-columns: repeat(2,1fr); } }
    </style>
</head>
<body>
<div class="page-wrap">
    <a href="index.html#professional" class="back-link">← back</a>
    <h1>PET GALLERY</h1>
    <p class="tagline">Friends I've had the honor of watching</p>
    <div class="hire-cta"><a href="pets.html">Hire Tess for Pet/House Sitting →</a></div>
    <div id="gallery-container"><p class="loading">Loading gallery...</p></div>
</div>
<script>
async function loadGallery() {
    const container = document.getElementById('gallery-container');
    try {
        const res = await fetch('data/pet-sits.json');
        const albums = await res.json();
        container.innerHTML = albums.filter(a => a.photos && a.photos.length > 0 || a.id !== 'album-add-yours').map(a => {
            if (a.id === 'album-add-yours') return `<div class="add-yours"><p>📸 Photos coming soon!</p><p style="font-size:.85em;">To add photos: upload images to dm_assets/ and add their paths to pet-sits.json</p></div>`;
            return `<div class="album">
                <div class="album-header">
                    <h2>${a.title}</h2>
                    ${a.description ? `<p>${a.description}</p>` : ''}
                    ${a.location ? `<div class="location">📍 ${a.location}</div>` : ''}
                </div>
                ${a.photos.length ? `<div class="photo-grid">${a.photos.map(p=>`<div class="photo-cell"><img src="${p}" alt="Pet photo" loading="lazy"></div>`).join('')}</div>`
                    : `<div class="photo-grid"><div class="photo-cell"><div class="photo-placeholder">🐾</div></div></div>`}
                ${a.testimonial ? `<div class="testimonial">"${a.testimonial}"</div>` : ''}
            </div>`;
        }).join('');
        if (!container.innerHTML.trim()) container.innerHTML = '<div class="add-yours"><p>📸 Pet photos coming soon!</p></div>';
    } catch(e) { container.innerHTML = '<p style="color:#888;text-align:center;">Gallery coming soon.</p>'; }
}
loadGallery();
</script>
</body>
</html>
