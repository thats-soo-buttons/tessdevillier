<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Creative worlds sandbox by Tess Devillier featuring XYZthians and TIGIDB universe threads.">
  <title>Creative Worlds Sandbox | Tess Devillier</title>
  <style>
    :root {
      --bg: #0c0a18;
      --panel: #251f3d;
      --line: #43385f;
      --ink: #eef5ff;
      --muted: #bcc8df;
      --accent: #60e4ff;
      --accent-2: #e081ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: 'Montserrat', Arial, sans-serif;
      background:
        radial-gradient(circle at 14% 10%, rgba(96, 228, 255, 0.2), transparent 30%),
        radial-gradient(circle at 88% 8%, rgba(224, 129, 255, 0.18), transparent 28%),
        var(--bg);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 30px 16px 48px; }
    .top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .top .top-left { justify-self: start; }
    .top .top-center { justify-self: center; }
    .top .top-right { justify-self: end; }
    .top a { color: var(--accent); text-decoration: none; font-weight: 700; }
    .top a:hover { text-decoration: underline; }
    h1 { margin: 0; font-size: clamp(1.9rem, 4.2vw, 2.8rem); letter-spacing: 0.03em; }
    .sub { margin: 10px 0 18px; color: var(--muted); max-width: 820px; line-height: 1.45; }
    .coming-soon-wrap {
      min-height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 0 8px;
    }
    .coming-soon {
      position: relative;
      display: inline-block;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: clamp(2.6rem, 8vw, 6rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d69cff;
      text-shadow:
        0 0 10px rgba(228, 129, 255, 0.55),
        0 0 24px rgba(171, 89, 255, 0.38),
        0 0 42px rgba(96, 228, 255, 0.18);
      filter: drop-shadow(0 0 18px rgba(193, 118, 255, 0.35));
      background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, #f1ccff 34%, #9e65ff 58%, #6d39da 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .coming-soon::after {
      content: '';
      position: absolute;
      inset: -14px -22px;
      background: linear-gradient(135deg, transparent 34%, rgba(255,255,255,0.12) 46%, rgba(163, 92, 255, 0.36) 52%, transparent 66%);
      transform: rotate(-7deg);
      filter: blur(8px);
      z-index: -1;
      border-radius: 18px;
      opacity: 0.9;
    }
    .coming-soon-sub {
      margin: 14px 0 0;
      color: rgba(238, 245, 255, 0.72);
      font-size: 0.94rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .note {
      margin: 0 0 16px;
      border: 1px solid rgba(96, 228, 255, 0.28);
      border-radius: 10px;
      padding: 10px 12px;
      background: rgba(96, 228, 255, 0.08);
      color: #dff8ff;
      font-size: 0.95rem;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 14px;
    }
    .chip {
      border: 1px solid #5e537e;
      background: rgba(37, 31, 61, 0.9);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip.active {
      border-color: var(--accent);
      color: var(--ink);
      box-shadow: 0 0 0 2px rgba(96, 228, 255, 0.2);
    }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card {
      background: linear-gradient(160deg, var(--panel), #17142d);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 16px;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #5f94c0;
      box-shadow: 0 16px 28px rgba(0, 0, 0, 0.35);
    }
    .card.active {
      border-color: var(--accent-2);
      box-shadow: 0 16px 30px rgba(224, 129, 255, 0.2);
    }
    .card h2 { margin: 0 0 8px; color: var(--accent); font-size: 1.08rem; }
    .card p { margin: 0; color: var(--muted); line-height: 1.45; }
    .card .detail {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(96, 228, 255, 0.2);
      display: none;
    }
    .card.active .detail {
      display: block;
    }
    .actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; }
    .footer-links {
      margin-top: 26px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.94rem;
    }
    .footer-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }
    .footer-links a:hover { text-decoration: underline; }
    .btn {
      display: inline-block;
      text-decoration: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      border: 1px solid rgba(96, 228, 255, 0.38);
      color: #0d1f2c;
      background: rgba(96, 228, 255, 0.95);
    }
    .btn.alt {
      border-color: rgba(224, 129, 255, 0.46);
      color: #f5dcff;
      background: rgba(224, 129, 255, 0.18);
    }
    .inquiry-floater {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 30;
      text-decoration: none;
      color: #eef5ff;
      background: linear-gradient(155deg, #251f3d, #14102a);
      border: 1px solid #60e4ff;
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 210px;
      box-shadow: 0 12px 26px rgba(0,0,0,0.38);
    }
    .inquiry-floater strong {
      display: block;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #60e4ff;
    }
    .inquiry-floater span {
      display: block;
      margin-top: 4px;
      font-weight: 800;
      min-height: 34px;
      line-height: 1.15;
    }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .inquiry-floater {
        left: 12px;
        right: 12px;
        bottom: 12px;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <div class="top">
      <a class="top-left" href="index.html#professional">Back To Home</a>
      <span class="top-center" style="color:var(--muted);">Creative Worlds</span>
      <span class="top-right" style="color:var(--muted);">Tess Does Stuff</span>
    </div>

    <div class="coming-soon-wrap">
      <div>
        <div class="coming-soon">COMING SOON</div>
        <p class="coming-soon-sub">Creative worlds are under construction</p>
      </div>
    </div>

    <div class="footer-links" aria-label="Sandbox footer links">
      <a href="index.html#professional">Home</a>
      <a href="allinoneplace.html">All In One Place</a>
    </div>
  </main>
  <a class="inquiry-floater" href="hire.html#contact-lanes" aria-label="Open inquiry links">
    <strong>Inquire</strong>
    <span id="inquiry-floater-text">Build A Creative World Together</span>
  </a>

  <script>
    (function () {
      var floaterText = document.getElementById('inquiry-floater-text');
      if (floaterText) {
        var messages = [
          'Creative Worlds Coming Soon',
          'Ask About The Sandbox',
          'Build A Creative World Together'
        ];
        var index = 0;
        setInterval(function () {
          index = (index + 1) % messages.length;
          floaterText.textContent = messages[index];
        }, 2600);
      }
    })();
  </script>
<script>
  (function () {
    var floaters = Array.prototype.slice.call(document.querySelectorAll('.inquiry-floater, .promo-floater, .otfn-floater'));
    if (!floaters.length) return;

    function getDismissKey(floater, index) {
      var token = floater.id ? floater.id : ('floater-' + index);
      return 'dismissed:' + window.location.pathname + ':' + token;
    }

    function updateMobileSpacing() {
      var hasVisibleFloater = floaters.some(function (floater) {
        return floater.style.display !== 'none';
      });
      document.documentElement.style.overflowY = 'auto';
      document.body.style.overflowY = 'auto';
      if (window.innerWidth <= 900 && hasVisibleFloater) {
        document.body.style.paddingBottom = '140px';
      } else {
        document.body.style.paddingBottom = '';
      }
    }

    floaters.forEach(function (floater, index) {
      floater.style.position = 'fixed';
      floater.style.overflow = 'visible';
      var key = getDismissKey(floater, index);

      if (window.localStorage.getItem(key) === '1') {
        floater.style.display = 'none';
        return;
      }

      if (!floater.querySelector('.floater-dismiss')) {
        var close = document.createElement('span');
        close.className = 'floater-dismiss';
        close.setAttribute('role', 'button');
        close.setAttribute('aria-label', 'Close floating inquiry button');
        close.tabIndex = 0;
        close.textContent = 'x';
        close.style.position = 'absolute';
        close.style.top = '-10px';
        close.style.right = '-10px';
        close.style.width = '22px';
        close.style.height = '22px';
        close.style.borderRadius = '999px';
        close.style.border = '1px solid #777';
        close.style.background = '#ffffff';
        close.style.color = '#111';
        close.style.display = 'flex';
        close.style.alignItems = 'center';
        close.style.justifyContent = 'center';
        close.style.fontSize = '12px';
        close.style.fontWeight = '700';
        close.style.cursor = 'pointer';
        close.style.lineHeight = '1';
        close.style.zIndex = '3';

        function dismiss(event) {
          event.preventDefault();
          event.stopPropagation();
          floater.style.display = 'none';
          window.localStorage.setItem(key, '1');
          updateMobileSpacing();
        }

        close.addEventListener('click', dismiss);
        close.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') dismiss(event);
        });
        floater.appendChild(close);
      }
    });

    window.addEventListener('resize', updateMobileSpacing);
    updateMobileSpacing();
  })();
</script>
<script>
  (function () {
    try {
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
    } catch (_) {}

    if (!window.location.hash) {
      window.addEventListener('pageshow', function () {
        window.scrollTo(0, 0);
      }, { once: true });
    }
  })();
</script>
</body>
</html>
