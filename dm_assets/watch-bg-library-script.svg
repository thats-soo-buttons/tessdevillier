<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280" fill="none">
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#2c2440"/>
      <rect y="12" width="24" height="1" fill="#3a3152" opacity="0.55"/>
    </pattern>
    <pattern id="script" width="180" height="140" patternUnits="userSpaceOnUse">
      <!-- Faint ruled writing lines -->
      <path d="M12 24H104" stroke="#c7b49a" stroke-opacity="0.28" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M18 42H112" stroke="#c7b49a" stroke-opacity="0.24" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M10 60H100" stroke="#c7b49a" stroke-opacity="0.22" stroke-width="1.1" stroke-linecap="round"/>

      <!-- Larger typewriter key rows -->
      <rect x="16" y="76" width="16" height="12" rx="2" stroke="#b8a58f" stroke-opacity="0.42" stroke-width="1.2"/>
      <rect x="36" y="76" width="16" height="12" rx="2" stroke="#b8a58f" stroke-opacity="0.42" stroke-width="1.2"/>
      <rect x="56" y="76" width="16" height="12" rx="2" stroke="#b8a58f" stroke-opacity="0.42" stroke-width="1.2"/>
      <rect x="76" y="76" width="16" height="12" rx="2" stroke="#b8a58f" stroke-opacity="0.42" stroke-width="1.2"/>
      <rect x="26" y="92" width="16" height="12" rx="2" stroke="#b8a58f" stroke-opacity="0.38" stroke-width="1.2"/>
      <rect x="46" y="92" width="16" height="12" rx="2" stroke="#b8a58f" stroke-opacity="0.38" stroke-width="1.2"/>
      <rect x="66" y="92" width="16" height="12" rx="2" stroke="#b8a58f" stroke-opacity="0.38" stroke-width="1.2"/>
      <rect x="86" y="92" width="16" height="12" rx="2" stroke="#b8a58f" stroke-opacity="0.38" stroke-width="1.2"/>

      <!-- Space bar and carriage/roller sketch -->
      <rect x="28" y="112" width="58" height="9" rx="3" stroke="#ae9c84" stroke-opacity="0.34" stroke-width="1.1"/>
      <rect x="120" y="20" width="44" height="10" rx="2" stroke="#a5967f" stroke-opacity="0.34" stroke-width="1.1"/>
      <circle cx="140" cy="56" r="15" stroke="#a5967f" stroke-opacity="0.3" stroke-width="1.1"/>
      <circle cx="140" cy="56" r="6" stroke="#a5967f" stroke-opacity="0.3" stroke-width="1"/>

      <!-- Sketch marks and margin symbols -->
      <path d="M122 84L160 70" stroke="#b9a88f" stroke-opacity="0.28" stroke-width="1.2"/>
      <path d="M122 94L160 108" stroke="#b9a88f" stroke-opacity="0.28" stroke-width="1.2"/>
      <path d="M124 118L134 106L146 120L158 102" stroke="#b9a88f" stroke-opacity="0.26" stroke-width="1.2" fill="none"/>
    </pattern>
  </defs>

  <rect width="360" height="280" fill="url(#paper)"/>
  <rect width="360" height="280" fill="url(#script)"/>
</svg>
