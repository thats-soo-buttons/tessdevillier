  <g fill="#f2e7ff" opacity="0.8" font-family="Georgia, 'Times New Roman', serif" font-size="34">
    <text x="90" y="120">ALQVE RITHA NOCTA</text>
    <text x="430" y="120">KELUM VESAR THREN</text>
    <text x="780" y="120">SIGNA ARCANA LEX</text>

    <text x="70" y="520">lorem obscura glypha manus</text>
    <text x="460" y="520">xyran tephra lingua fracta</text>
    <text x="840" y="520">ordo lumen tenebra script</text>

    <text x="120" y="1110">zathor velum kirin et cetera arcana</text>
    <text x="650" y="1110">vetus sigillum lingua mutata</text>
  </g>

  <g opacity="0.8" stroke="#f2e7ff" fill="none" stroke-width="3">
    <path d="M82 420 q40 -38 82 0 q40 38 82 0 q40 -38 82 0"/>
    <path d="M430 430 q28 -46 56 0 q28 46 56 0 q28 -46 56 0"/>
