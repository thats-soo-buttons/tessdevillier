<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Memphis style arcane language and sigil pattern">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1022"/>
      <stop offset="100%" stop-color="#09060f"/>
    </linearGradient>
    <pattern id="noise" width="180" height="180" patternUnits="userSpaceOnUse">
      <rect width="180" height="180" fill="transparent"/>
      <line x1="14" y1="20" x2="86" y2="58" stroke="#00d6ff" stroke-width="6"/>
      <line x1="120" y1="24" x2="164" y2="96" stroke="#ff58d2" stroke-width="6"/>
      <circle cx="38" cy="144" r="10" fill="#ffdc58"/>
      <rect x="108" y="132" width="44" height="12" rx="6" fill="#6fff98"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#noise)" opacity="0.75"/>

  <g opacity="0.82" stroke="#d7c7ff" fill="none" stroke-width="4">
    <circle cx="230" cy="220" r="88"/>
    <circle cx="230" cy="220" r="48"/>
    <path d="M152 220h156 M230 142v156"/>
