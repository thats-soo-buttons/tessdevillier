    <circle cx="980" cy="220" r="82"/>
    <path d="M905 220 q75 -100 150 0 q-75 100 -150 0"/>

    <circle cx="300" cy="760" r="120"/>
    <path d="M180 760h240 M300 640v240"/>
    <path d="M224 684 l152 152 M376 684 l-152 152"/>

