          <ellipse cx="272" cy="86" rx="10" ry="7" transform="rotate(-20 272 86)"/>
          <rect x="280" y="44" width="3" height="42"/>
        </g>

        <path d="M20 110 q20 -14 34 0 q14 14 34 0 q20 -14 34 0" fill="none" stroke="#f6efff" stroke-opacity="0.2" stroke-width="3"/>
        <path d="M248 56 q16 -9 16 7 q0 21 -18 28" stroke="#f6efff" stroke-opacity="0.24" stroke-width="3" fill="none"/>
        <circle cx="248" cy="104" r="7" fill="#f6efff" fill-opacity="0.28"/>
