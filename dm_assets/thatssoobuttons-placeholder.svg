<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b13"/>
      <stop offset="50%" stop-color="#1a0f2e"/>
      <stop offset="100%" stop-color="#3b1a5a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7f5bff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
    </filter>
    <filter id="glowShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7f5bff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#glow)"/>
  <rect width="640" height="640" filter="url(#noise)" opacity="0.35"/>

  <rect x="88" y="120" width="464" height="320" rx="22" fill="#140c22" stroke="#7f5bff" stroke-width="4"/>
  <rect x="110" y="144" width="420" height="272" rx="14" fill="#0a0714"/>

  <g filter="url(#glowShadow)" transform="translate(0,0)">
    <path d="M220 190h200l40 56-40 56h-40l-40 40h-80l-8 28h-68l12-40-24-140z" fill="#7f5bff"/>
    <rect x="302" y="240" width="32" height="72" rx="6" fill="#fff"/>
    <rect x="358" y="240" width="32" height="72" rx="6" fill="#fff"/>
  </g>

  <g font-family="Montserrat, Arial, sans-serif" text-anchor="middle">
    <text x="320" y="495" font-size="28" fill="#d7c9ff" letter-spacing="3">THAT'S SOO BUTTONS</text>
    <text x="320" y="530" font-size="18" fill="#9b7dff" letter-spacing="2">TWITCH CREATIVE HUB</text>
  </g>

  <g opacity="0.25">
    <circle cx="130" cy="88" r="3" fill="#fff"/>
    <circle cx="540" cy="110" r="2" fill="#fff"/>
    <circle cx="520" cy="520" r="3" fill="#fff"/>
    <circle cx="118" cy="530" r="2" fill="#fff"/>
  </g>
</svg>
