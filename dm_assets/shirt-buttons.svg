<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Close-up of shirt buttons">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f5ef"/>
      <stop offset="45%" stop-color="#ece4d8"/>
      <stop offset="100%" stop-color="#d8c6ac"/>
    </linearGradient>
    <linearGradient id="placket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6d8c3"/>
      <stop offset="100%" stop-color="#c8b396"/>
    </linearGradient>
    <radialGradient id="buttonFace" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fffefc"/>
      <stop offset="65%" stop-color="#f1e8da"/>
      <stop offset="100%" stop-color="#c9b195"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6e5944" flood-opacity="0.28"/>
    </filter>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="transparent"/>
      <path d="M0 7h14M7 0v14" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#cloth)"/>
  <rect width="1200" height="900" fill="url(#weave)"/>

  <rect x="495" y="70" width="210" height="760" rx="20" fill="url(#placket)" filter="url(#softShadow)"/>
