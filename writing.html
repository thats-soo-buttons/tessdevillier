<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing | Tess Devillier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0a0a; color: #f5f5f5; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        .page-wrap { max-width: 800px; margin: 0 auto; padding: 48px 20px 80px; }
        .back-link { color: #ffd700; text-decoration: none; font-size: .9em; letter-spacing: 1px; display: inline-block; margin-bottom: 32px; }
        .back-link:hover { text-decoration: underline; }
        h1 { font-family: 'Cinzel', serif; color: #ffd700; font-size: 2.4rem; letter-spacing: 4px; text-align: center; margin-bottom: 8px; }
        .tagline { text-align: center; color: #888; margin-bottom: 48px; font-size: .95em; letter-spacing: 1px; }
        .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 32px; justify-content: center; }
        .filter-btn { background: #111; border: 1px solid #333; color: #cfcfcf; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: .85em; transition: all .2s; }
        .filter-btn.active, .filter-btn:hover { background: #ffd700; color: #111; border-color: #ffd700; font-weight: 700; }
        .writing-card { background: #111; border: 1.5px solid #222; border-radius: 16px; margin-bottom: 20px; overflow: hidden; transition: border-color .2s; }
        .writing-card:hover { border-color: #ffd70066; }
        .writing-header { padding: 22px 26px; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
        .writing-meta { flex: 1; }
        .writing-type-badge { font-size: .72em; font-weight: 700; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 8px; }
        .type-snippet { background: #1a0533; color: #bb86fc; border: 1px solid #bb86fc44; }
        .type-prompt { background: #001a0d; color: #00e676; border: 1px solid #00e67644; }
        .writing-meta h2 { font-family: 'Cinzel', serif; color: #ffd700; font-size: 1.15rem; margin: 0 0 6px 0; }
        .writing-meta .preview { color: #888; font-size: .9em; font-style: italic; }
        .writing-meta .universe-tag { color: #ffd700; font-size: .8em; margin-top: 8px; }
        .expand-icon { color: #ffd700; font-size: 1.4em; flex-shrink: 0; transition: transform .3s; }
        .writing-body { display: none; padding: 0 26px 26px; border-top: 1px solid #1a1a1a; }
        .writing-body.open { display: block; }
        .writing-text { white-space: pre-wrap; color: #e0e0e0; line-height: 1.9; font-size: .97em; margin: 20px 0; }
        .loading { text-align: center; color: #555; padding: 60px 0; }
        .discord-cta {
            border: 1px solid #3a2d16;
            background: linear-gradient(140deg, #16120c, #0f0f0f);
            border-radius: 14px;
            padding: 14px 16px;
            margin: 0 auto 26px;
            color: #d7c7ad;
            max-width: 760px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
        }
        .discord-cta p { margin: 0; line-height: 1.5; }
        .discord-cta a {
            display: inline-block;
            margin-top: 8px;
            color: #ffd700;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: .4px;
        }
        .discord-cta a:hover { text-decoration: underline; }
        @media (max-width: 600px) { h1 { font-size: 1.7rem; } }
    </style>
</head>
<body>
<div class="page-wrap">
    <a href="index.html#professional" class="back-link">← back</a>
    <h1>WRITING</h1>
    <p class="tagline">Fiction snippets · Narrative design · Writing prompts</p>
    <div class="discord-cta" aria-label="Discord writing community invite">
        <p>Want more writing prompts, live workshops, and free creative resources/services? Join the Discord writing space.</p>
        <a href="https://discord.gg/dC34nguEEC" target="_blank" rel="noopener noreferrer">Join the Discord community</a>
    </div>
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterBy('all', this)">All</button>
        <button class="filter-btn" onclick="filterBy('snippet', this)">Snippets</button>
        <button class="filter-btn" onclick="filterBy('prompt', this)">Prompts</button>
    </div>
    <div id="writing-container"><p class="loading">Loading writing...</p></div>
</div>
<script>
let allWriting = [];
async function loadWriting() {
    const container = document.getElementById('writing-container');
    try {
        const res = await fetch('data/writing.json');
        allWriting = await res.json();
        render(allWriting);
    } catch(e) { container.innerHTML = '<p style="color:#888;text-align:center;">Writing coming soon.</p>'; }
}
function render(items) {
    const container = document.getElementById('writing-container');
    if (!items.length) { container.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">Nothing here yet.</p>'; return; }
    container.innerHTML = items.map((w, i) => `
        <div class="writing-card" data-type="${w.type}">
            <div class="writing-header" onclick="toggle('w${i}')">
                <div class="writing-meta">
                    <span class="writing-type-badge type-${w.type}">${w.type}</span>
                    <h2>${w.title}</h2>
                    <div class="preview">${w.preview}</div>
                    ${w.universe ? `<div class="universe-tag">📖 ${w.universe}</div>` : ''}
                </div>
                <span class="expand-icon" id="icon-w${i}">▼</span>
            </div>
            <div class="writing-body" id="body-w${i}">
                <div class="writing-text">${w.full.replace(/\n/g,'<br>')}</div>
            </div>
        </div>`).join('');
}
function toggle(id) {
    const body = document.getElementById('body-'+id);
    const icon = document.getElementById('icon-'+id);
    const open = body.classList.toggle('open');
    icon.style.transform = open ? 'rotate(180deg)' : '';
}
function filterBy(type, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(type === 'all' ? allWriting : allWriting.filter(w => w.type === type));
}
loadWriting();
</script>
</body>
</html>
