<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pets contact page for Tess Devillier house and pet sitting inquiries.">
    <title>Pets Contact | Tess Devillier</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fbf7ef;
            --blue-dark: #4f87bf;
            --ink: #5f5a55;
            --soft: #8f8a84;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: linear-gradient(180deg, #f8f1e8 0%, #edf4fb 100%);
            color: var(--ink);
            font-family: 'Quicksand', Arial, sans-serif;
            line-height: 1.55;
        }
        .wrap {
            max-width: 760px;
            margin: 32px auto;
            padding: 0 16px;
        }
        .card {
            background: var(--paper);
            border: 1px solid rgba(120,110,100,0.2);
            border-radius: 14px;
            padding: 28px 22px;
            box-shadow: 0 14px 30px rgba(92, 92, 110, 0.10);
        }
        h1 {
            font-family: 'Patrick Hand', cursive;
            font-size: clamp(2.2rem, 6vw, 3.2rem);
            color: var(--blue-dark);
            margin: 0 0 10px;
            text-align: center;
        }
        p { margin: 0 0 10px; color: var(--soft); }
        .line {
            margin: 12px 0;
            font-size: 1.08rem;
            color: var(--ink);
            font-weight: 700;
        }
        .line a {
            color: var(--blue-dark);
            text-decoration: none;
            border-bottom: 1px solid rgba(79,135,191,0.25);
        }
        .links {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .links a {
            text-decoration: none;
            color: #fff;
            background: var(--blue-dark);
            padding: 10px 14px;
            border-radius: 999px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="wrap" role="main">
        <section class="card" aria-label="Pets Contact">
            <h1>Pets Contact</h1>
            <p>For house and pet sitting requests, reach out using the details below.</p>
            <div class="line">Text/Call: <a href="tel:+12252834458">(225) 283-4458</a></div>
            <div class="line">Email: <a href="mailto:contact@tessdevillier.com">contact@tessdevillier.com</a></div>
            <div class="line">Rover: <a href="https://www.rover.com/members/tess-d-your-pets-new-best-friend/" target="_blank" rel="noopener noreferrer">View profile / leave a review</a></div>
            <div class="links">
                <a href="#">Back to top</a>
                <a href="pets.html">Back to Pets</a>
                <a href="index.html#professional">Home</a>
            </div>
        </section>
    </main>
</body>
</html>
