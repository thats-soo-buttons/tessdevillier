<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpapers & Downloads | Tess Devillier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0a0a; color: #f5f5f5; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        .page-wrap { max-width: 900px; margin: 0 auto; padding: 48px 20px 80px; }
        .back-link { color: #ffd700; text-decoration: none; font-size: .9em; letter-spacing: 1px; display: inline-block; margin-bottom: 32px; }
        h1 { font-family: 'Cinzel', serif; color: #ffd700; font-size: 2.4rem; letter-spacing: 4px; text-align: center; margin-bottom: 8px; }
        .tagline { text-align: center; color: #888; margin-bottom: 48px; font-size: .95em; letter-spacing: 1px; }
        .wallpaper-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .wallpaper-card { background: #111; border: 1.5px solid #222; border-radius: 18px; overflow: hidden; transition: border-color .2s, transform .2s; }
        .wallpaper-card:hover { border-color: #ffd70066; transform: translateY(-3px); }
        .wallpaper-preview { width: 100%; height: 200px; object-fit: cover; display: block; background: #1a1a1a; }
        .wallpaper-preview-placeholder { width: 100%; height: 200px; background: linear-gradient(135deg,#1a1a1a,#222); display: flex; align-items: center; justify-content: center; color: #444; font-size: 2rem; }
        .wallpaper-info { padding: 18px 20px; }
        .wallpaper-info h2 { font-family: 'Cinzel', serif; color: #ffd700; font-size: 1.1rem; margin: 0 0 6px 0; }
        .wallpaper-info p { color: #888; font-size: .85em; margin: 0 0 12px 0; line-height: 1.6; }
        .wallpaper-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .tag { background: #1a1a1a; border: 1px solid #333; color: #cfcfcf; font-size: .72em; padding: 2px 8px; border-radius: 12px; }
        .resolution-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .res-pill { background: #0a1a0a; border: 1px solid #00e67633; color: #00e676; font-size: .72em; padding: 2px 8px; border-radius: 12px; }
        .download-btn { display: inline-block; background: #ffd700; color: #111; font-weight: 700; padding: 8px 18px; border-radius: 8px; text-decoration: none; font-size: .85em; transition: background .2s; }
        .download-btn:hover { background: #ffe566; }
        .coming-soon { color: #555; font-size: .82em; font-style: italic; }
        .loading { text-align: center; color: #555; padding: 60px 0; }
        @media (max-width: 640px) { .wallpaper-grid { grid-template-columns: 1fr; } h1 { font-size: 1.7rem; } }
    </style>
</head>
<body>
<div class="page-wrap">
    <a href="index.html" class="back-link">← back</a>
    <h1>WALLPAPERS</h1>
    <p class="tagline">Free downloads · Photography · Lore art</p>
    <div class="wallpaper-grid" id="wallpapers-container"><p class="loading" style="grid-column:1/-1;">Loading wallpapers...</p></div>
</div>
<script>
async function loadWallpapers() {
    const container = document.getElementById('wallpapers-container');
    try {
        const res = await fetch('data/wallpapers.json');
        const items = await res.json();
        container.innerHTML = items.map(w => `
            <div class="wallpaper-card">
                ${w.preview_img
                    ? `<img src="${w.preview_img}" alt="${w.title}" class="wallpaper-preview" loading="lazy">`
                    : `<div class="wallpaper-preview-placeholder">🖼️</div>`}
                <div class="wallpaper-info">
                    <h2>${w.title}</h2>
                    <p>${w.description}</p>
                    <div class="wallpaper-tags">${w.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
                    <div class="resolution-list">${w.resolutions.map(r=>`<span class="res-pill">${r}</span>`).join('')}</div>
                    ${w.download_url
                        ? `<a href="${w.download_url}" download class="download-btn">⬇ Download</a>`
                        : `<span class="coming-soon">${w.note||'Download coming soon'}</span>`}
                </div>
            </div>`).join('');
    } catch(e) { container.innerHTML = '<p style="color:#888;text-align:center;grid-column:1/-1;">Downloads coming soon.</p>'; }
}
loadWallpapers();
</script>
</body>
</html>
