<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos | Tess Devillier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0a0a; color: #f5f5f5; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        .page-wrap { max-width: 960px; margin: 0 auto; padding: 48px 20px 80px; }
        .back-link { color: #ffd700; text-decoration: none; font-size: .9em; letter-spacing: 1px; display: inline-block; margin-bottom: 32px; }
        .back-link:hover { text-decoration: underline; }
        h1 { font-family: 'Cinzel', serif; color: #ffd700; font-size: 2.4rem; letter-spacing: 4px; text-align: center; margin-bottom: 8px; }
        .tagline { text-align: center; color: #888; margin-bottom: 18px; font-size: .95em; letter-spacing: 1px; }
        .social-cta {
            margin: 0 auto 28px;
            max-width: 820px;
            border: 1px solid #3a2d16;
            border-radius: 14px;
            background: linear-gradient(150deg, #15110b, #0e0e0e);
            color: #d9c9b0;
            padding: 14px 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .social-cta p { margin: 0; line-height: 1.55; }
        .social-links {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .social-links a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .social-links a:hover { text-decoration: underline; }
        .hint { text-align: center; color: #a6a6a6; margin-bottom: 36px; font-size: .9em; line-height: 1.6; }
        .album { margin-bottom: 52px; }
        .album-header { margin-bottom: 18px; border-left: 3px solid #ffd700; padding-left: 16px; }
        .album-header h2 { font-family: 'Cinzel', serif; color: #ffd700; font-size: 1.35rem; margin: 0 0 4px 0; }
        .album-header p { color: #888; font-size: .9em; margin: 0; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .photo-cell { background: #1a1a1a; border-radius: 10px; aspect-ratio: 1; overflow: hidden; border: 1px solid #222; }
        .photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
        .photo-cell img:hover { transform: scale(1.05); }
        .photo-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #333; font-size: 2rem; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .chip { background: #1a1a1a; border: 1px solid #333; color: #cfcfcf; font-size: .72em; padding: 2px 8px; border-radius: 12px; }
        .loading { text-align: center; color: #555; padding: 60px 0; }
        @media (max-width: 600px) { h1 { font-size: 1.7rem; } .photo-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
<div class="page-wrap">
    <a href="index.html#professional" class="back-link">← back</a>
    <h1>PHOTOS</h1>
    <p class="tagline">Panasonic G85 + Lightroom</p>
    <div class="social-cta" aria-label="Social and Discord photo community call to action">
        <p>Follow on Instagram and TikTok, and join the Discord to see more photos, prompt drops, workshops, and free creative resources/services.</p>
        <div class="social-links">
            <a href="https://www.instagram.com/thatssoobuttons" target="_blank" rel="noopener noreferrer">Follow on Instagram</a>
            <a href="https://www.tiktok.com/@thatssoobuttons" target="_blank" rel="noopener noreferrer">Follow on TikTok</a>
            <a href="https://discord.gg/dC34nguEEC" target="_blank" rel="noopener noreferrer">Join the Discord</a>
        </div>
    </div>
    <div id="photos-container"><p class="loading">Loading photos...</p></div>
</div>
<script>
async function loadPhotos() {
    const container = document.getElementById('photos-container');
    try {
        const res = await fetch('data/photos.json');
        const albums = await res.json();
        container.innerHTML = albums.map(album => `
            <div class="album">
                ${(album.title || album.description)
                    ? `<div class="album-header">
                        ${album.title ? `<h2>${album.title}</h2>` : ''}
                        ${album.description ? `<p>${album.description}</p>` : ''}
                      </div>`
                    : ''}
                ${(album.tags && album.tags.length)
                    ? `<div class="chips">${album.tags.map(tag => `<span class="chip">${tag}</span>`).join('')}</div>`
                    : ''}
                ${(album.albums || []).map(inner => `
                    <div style="margin-top:18px;">
                        <div style="font-weight:700;color:#ffd700;margin-bottom:8px;letter-spacing:1px;">${inner.title}</div>
                        ${inner.photos && inner.photos.length
                            ? `<div class="photo-grid">${inner.photos.map(path => `<div class="photo-cell"><img src="${path}" alt="Photo" loading="lazy"></div>`).join('')}</div>`
                            : `<div class="photo-grid"><div class="photo-cell"><div class="photo-placeholder">📷</div></div></div>`}
                    </div>
                `).join('')}
            </div>
        `).join('');
    } catch (e) {
        container.innerHTML = '<p style="color:#888;text-align:center;">Photos coming soon.</p>';
    }
}
loadPhotos();
</script>
</body>
</html>
