<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PhosphorNet Navigator browser shell for the whimsical side of Tess Devillier.">
  <title>PhosphorNet Navigator</title>
</head>
<body bgcolor="#081108" text="#8fffd0" link="#8fffd0" vlink="#b9d9ff" alink="#ffffff">
  <center>
    <table width="980" border="1" cellpadding="10" cellspacing="0" bgcolor="#122018">
      <tr bgcolor="#1b3023">
        <td align="center"><font face="Courier New" size="6"><b>PHOSPHORNET NAVIGATOR</b></font></td>
      </tr>
      <tr>
        <td>
          <p><font face="Verdana" size="2"><b>Status:</b> <span id="addressBar">loading...</span></font></p>
          <iframe id="browserFrame" title="PhosphorNet content frame" style="width:100%;height:78vh;border:1px solid #5ed39a;background:#fff;"></iframe>
          <p><font face="Verdana" size="2" id="fallbackNotice" hidden>If this page cannot load in-frame, use the direct page link from the address bar path.</font></p>
          <p align="center"><font face="Verdana" size="2"><a href="whimsical.html">Back</a> | <a href="#" id="reloadLink">Reload</a> | <a href="index.html#professional">Home</a></font></p>
        </td>
      </tr>
    </table>
  </center>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var page = params.get('page') || 'index.html';
      var title = params.get('title') || 'Document';
      var frame = document.getElementById('browserFrame');
      var reloadLink = document.getElementById('reloadLink');
      var addressBar = document.getElementById('addressBar');
      document.title = title + ' | PhosphorNet Navigator';
      addressBar.textContent = 'phosphornet://local/' + page;
      var decodedPage = page;
      try {
        decodedPage = decodeURIComponent(page);
      } catch (_) {}
      var hashIndex = decodedPage.indexOf('#');
      var pagePath = hashIndex === -1 ? decodedPage : decodedPage.slice(0, hashIndex);
      var pageHash = hashIndex === -1 ? '' : decodedPage.slice(hashIndex);
      var sep = pagePath.indexOf('?') === -1 ? '?' : '&';
      frame.src = pagePath + sep + '_v=' + Date.now() + pageHash;
      if (reloadLink) {
        reloadLink.addEventListener('click', function (event) {
          event.preventDefault();
          if (frame && frame.contentWindow) {
            frame.contentWindow.location.reload();
          }
        });
      }
    })();
  </script>
</body>
</html>
