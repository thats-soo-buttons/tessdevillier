<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming | Tess Devillier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0a0a; color: #f5f5f5; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        .page-wrap { max-width: 860px; margin: 0 auto; padding: 48px 20px 80px; }
        .back-link { color: #ffd700; text-decoration: none; font-size: .9em; letter-spacing: 1px; display: inline-block; margin-bottom: 32px; }
        h1 { font-family: 'Cinzel', serif; color: #ffd700; font-size: 2.4rem; letter-spacing: 4px; text-align: center; margin-bottom: 8px; }
        .tagline { text-align: center; color: #888; margin-bottom: 48px; font-size: .95em; letter-spacing: 1px; }
        .twitch-cta { background: #1a0533; border: 1px solid #9146ff44; border-radius: 14px; padding: 18px 24px; margin-bottom: 36px; display: flex; align-items: center; gap: 18px; }
        .twitch-cta a { color: #9146ff; font-weight: 700; text-decoration: none; }
        .twitch-cta a:hover { text-decoration: underline; }
        .post-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
        .post-card { background: #111; border: 1.5px solid #222; border-radius: 16px; overflow: hidden; cursor: pointer; transition: border-color .2s, transform .2s; }
        .post-card:hover { border-color: #ffd70066; transform: translateY(-3px); }
        .post-card-header { padding: 20px 22px 14px; }
        .game-badge { font-size: .72em; font-weight: 700; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 10px; background: #0a0a2a; color: #7b9fff; border: 1px solid #7b9fff44; }
        .post-card h2 { font-family: 'Cinzel', serif; color: #ffd700; font-size: 1.05rem; margin: 0 0 8px 0; }
        .post-card .preview { color: #888; font-size: .88em; font-style: italic; line-height: 1.6; }
        .post-card .date { color: #555; font-size: .78em; margin-top: 10px; }
        .post-body { display: none; padding: 0 22px 20px; border-top: 1px solid #1a1a1a; }
        .post-body.open { display: block; }
        .post-body p { color: #cfcfcf; line-height: 1.8; margin: 16px 0 0; font-size: .93em; }
        .loading { text-align: center; color: #555; padding: 60px 0; }
        @media (max-width: 640px) { .post-grid { grid-template-columns: 1fr; } h1 { font-size: 1.7rem; } }
    </style>
</head>
<body>
<div class="page-wrap">
    <a href="index.html" class="back-link">← back</a>
    <h1>GAMING</h1>
    <p class="tagline">Stream recaps · Gaming posts · Live on Twitch</p>
    <div class="twitch-cta">
        <span style="font-size:1.5em;">🟣</span>
        <div>Watch live at <a href="https://twitch.tv/thats_soo_buttons" target="_blank">twitch.tv/thats_soo_buttons</a> · <a href="twitch-prime.html">Free sub with Prime →</a></div>
    </div>
    <div class="post-grid" id="gaming-container"><p class="loading" style="grid-column:1/-1;">Loading posts...</p></div>
</div>
<script>
async function loadGaming() {
    const container = document.getElementById('gaming-container');
    try {
        const res = await fetch('data/gaming.json');
        const posts = await res.json();
        container.innerHTML = posts.map((p, i) => `
            <div class="post-card" onclick="toggle(${i})">
                <div class="post-card-header">
                    <span class="game-badge">${p.tags[0]||'gaming'}</span>
                    <h2>${p.title}</h2>
                    <div class="preview">${p.preview}</div>
                    <div class="date">${p.date||''}</div>
                </div>
                <div class="post-body" id="body-g${i}">
                    <p>${p.full.replace(/\n/g,'<br>')}</p>
                </div>
            </div>`).join('');
    } catch(e) { container.innerHTML = '<p style="color:#888;text-align:center;grid-column:1/-1;">Gaming posts coming soon.</p>'; }
}
function toggle(i) {
    document.getElementById('body-g'+i).classList.toggle('open');
}
loadGaming();
</script>
</body>
</html>
